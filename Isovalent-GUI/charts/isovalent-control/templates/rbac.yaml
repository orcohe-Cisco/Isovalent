{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ic.serviceAccountName" . }}
  labels: {{- include "ic.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ic.fullname" . }}-policies
  labels: {{- include "ic.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - tracingpolicies
      - tracingpoliciesnamespaced
    verbs: [get, list, watch, create, update, patch, delete]
  # Native NetworkPolicies, so the console can load and edit the rules the
  # cluster already has rather than only the ones it wrote itself.
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Namespace picker, and the protected-namespace check.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  # Version discovery reads the cilium / tetragon DaemonSet image tags.
  - apiGroups: ["apps"]
    resources: [daemonsets, deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ic.fullname" . }}-policies
  labels: {{- include "ic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ic.fullname" . }}-policies
subjects:
  - kind: ServiceAccount
    name: {{ include "ic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
