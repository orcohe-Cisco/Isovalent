# One-command demo: backend in mock mode + frontend.
#   docker compose -f deploy/docker-compose.yaml up --build
# UI on http://localhost:3000, API on http://localhost:8081.
services:
  backend:
    build: ../backend
    environment:
      IC_MODE: mock
      IC_LISTEN_ADDR: ":8081"
    ports:
      - "8081:8081"
  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - backend
