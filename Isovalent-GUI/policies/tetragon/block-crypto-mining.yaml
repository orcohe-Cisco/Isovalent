apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-crypto-mining
  labels:
    isovalent-control.io/category: egress
  annotations:
    isovalent-control.io/action: monitor
    isovalent-control.io/description: >-
      Detects outbound TCP to common cryptomining-pool ports
      (3333, 4444, 5555, 7777, 14444, 45700).
spec:
  kprobes:
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchArgs:
            - index: 0
              operator: "DPort"
              values:
                - "3333"
                - "4444"
                - "5555"
                - "7777"
                - "14444"
                - "45700"
          matchActions:
            - action: Post   # flip to Sigkill to enforce
