{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ic.serviceAccountName" . }}
  labels: {{- include "ic.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ic.fullname" . }}-policies
  labels: {{- include "ic.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - tracingpolicies
      - tracingpoliciesnamespaced
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ic.fullname" . }}-policies
  labels: {{- include "ic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ic.fullname" . }}-policies
subjects:
  - kind: ServiceAccount
    name: {{ include "ic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
