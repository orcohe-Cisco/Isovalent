# ============================================================================
# Scenario 10 - Crypto miner container (kill the miner process on exec)
# ----------------------------------------------------------------------------
# BLOCK: Match the executing binary at the LSM `bprm_check_security` hook (the
# documented, TOCTOU-safe way to enforce on execution-by-path) and Sigkill it.
# Combine with the egress lockdown (policies/network/10-cryptominer-egress.yaml).
#
# PREREQUISITE: BPF-LSM must be enabled in the kernel (CONFIG_BPF_LSM=y and
# `lsm=...,bpf` in the boot cmdline). Most modern distros ship this; Tetragon
# logs a warning at startup if LSM enforcement is unavailable. If BPF-LSM is not
# available, use the observe-only kprobe variant at the bottom instead.
#
# IDENTIFY: even without enforcement, `tetra getevents --pods batch-check` shows
# the process_exec of the miner and its outbound connect() to the pool.
# ============================================================================
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-known-miners
spec:
  lsmhooks:
    - hook: "bprm_check_security"
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "/xmrig"
                - "/minerd"
                - "/kdevtmpfsi"
                - "/system-startup"      # the GOAT batch-check payload wrapper
          matchActions:
            - action: Sigkill
