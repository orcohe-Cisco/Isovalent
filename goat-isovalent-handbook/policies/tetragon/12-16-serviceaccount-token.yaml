# ============================================================================
# Scenarios 12 & 16 - Reading the ServiceAccount token / secret material
# ----------------------------------------------------------------------------
# Scenario 12 dumps env + mounted secrets; scenario 16 reads the SA token at
# /var/run/secrets/kubernetes.io/serviceaccount/token and replays it against the
# API server. Legitimate app code rarely cat()s the raw token file — so a read
# of it by a shell/curl is high signal.
#
# IDENTIFY: Post events on any open of the token path, with the binary that did
# it. Pair with policies/network/16-apiserver-egress-restrict.yaml so even a
# stolen token can't reach the API server over the network.
#
# To ENFORCE, add `- action: Sigkill` — but scope tightly first (many runtimes
# read the token legitimately); prefer matchBinaries to limit to shells/curl.
# ============================================================================
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: detect-serviceaccount-token-read
spec:
  kprobes:
    - call: "security_file_open"
      syscall: false
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Postfix"
              values:
                - "serviceaccount/token"
          matchBinaries:
            - operator: "In"
              values:
                - "/bin/cat"
                - "/usr/bin/cat"
                - "/bin/sh"
                - "/bin/bash"
                - "/usr/bin/curl"
                - "/usr/bin/wget"
          matchActions:
            - action: Post
