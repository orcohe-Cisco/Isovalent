# Default values for isovalent-control.
backend:
  image:
    repository: ghcr.io/isovalent-control/backend
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicas: 1
  hubbleRelayAddr: hubble-relay.kube-system.svc.cluster.local:80
  tetragonAddr: tetragon.kube-system.svc.cluster.local:54321
  # Embedded consoles, reverse-proxied at /hubble-ui/ and /grafana/ so they can
  # be framed from this origin without a second login.
  hubbleUiUrl: http://hubble-ui.kube-system.svc.cluster.local:80
  grafanaUrl: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
  grafanaDashboardUid: isovalent-control
  clusterName: default
  corsOrigin: "*"
  # Policies authored in the console can never select these namespaces. The
  # release namespace is always added to the set.
  protectedNamespaces: "kube-system"
  # Durable history and audit log. Without it both are in-memory rings, lost
  # on restart.
  dbDsn: ""
  oidc:
    # Leave issuer empty to run without authentication. Every caller is then
    # treated as an admin, and the backend logs a warning saying so.
    issuer: ""
    clientID: ""
    rolesClaim: groups
  ai:
    # anthropic | gemini | openai | disabled. Any OpenAI-compatible gateway
    # works via baseUrl.
    provider: disabled
    baseUrl: ""
    model: ""
    # Name of an existing Secret with an "api-key" entry. The key is mounted,
    # never passed as an environment variable and never sent to the browser.
    existingSecret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

frontend:
  image:
    repository: ghcr.io/isovalent-control/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Browser-facing URL of the backend API (ingress host or port-forward).
  apiUrl: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

service:
  type: ClusterIP
  backendPort: 8081
  frontendPort: 3000

ingress:
  enabled: false
  className: ""
  host: isovalent-control.local
  tls: []
  annotations: {}

rbac:
  # Creates a ServiceAccount + ClusterRole limited to the policy CRDs the
  # backend manages. Disable to bring your own.
  create: true

serviceAccount:
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
