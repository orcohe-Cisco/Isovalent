# Adapted for isovalent-control: added category label + action annotation so the
# Runtime Policies screen can group it and toggle Monitor/Kill.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: process-exec-elf
  labels:
    isovalent-control.io/category: exec
  annotations:
    isovalent-control.io/action: monitor
    isovalent-control.io/description: "Records the ELF binary backing every exec (security_bprm_creds_from_file)\
      \ \u2014 full execution provenance."
    isovalent-control.io/source: gccloudone-aurora/tetragon-policies (MIT)
spec:
  kprobes:
  - call: security_bprm_creds_from_file
    syscall: false
    args:
    - index: 0
      type: nop
    - index: 1
      type: file
